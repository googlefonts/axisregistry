on:
  push:
    tags:
      - "v*" # Push events to matching `v*` version strings. e.g. v1.0, v20.15.10

name: Create and Publish Release

permissions: {}

jobs:
  check-rust-ok:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build
        run: cargo build --verbose
      - name: Check for lints
        run: cargo clippy
      - name: Run tests
        run: |
          cargo test --verbose

  build:
    name: Build Python distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel build

      - name: Get release notes
        id: release_notes
        run: |
          # By default, GH Actions checkout will only fetch a single commit.
          # For us to extract the release notes, we need to fetch the tags
          # and tag annotations as well.
          # https://github.com/actions/checkout/issues/290
          git fetch --tags --force
          TAG_NAME=${GITHUB_REF/refs\/tags\//}
          echo "$(git tag -l --format='%(contents)' "$TAG_NAME")" > "${RUNNER_TEMP}/CHANGELOG.md"

      - name: Create GitHub release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/CHANGELOG.md"

      - name: Build a binary wheel and a source tarball
        run: python3 -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
      - build
      - check-tagging # Otherwise versions can get out of sync if Python is built/released and Rust is not
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/axisregistry
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Stage distributions and trigger OSS Exit Gate release
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 -m venv .exit-gate-venv
          .exit-gate-venv/bin/python -m pip install --upgrade pip twine keyrings.google-artifactregistry-auth
          .exit-gate-venv/bin/python -m twine upload \
            --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/axisregistry--pypi/ \
            --non-interactive \
            --skip-existing \
            dist/*
          cat <<EOF > manifest.json
          {
            "publish_all": true
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/axisregistry/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"

  check-tagging:
    name: >-
      Check that the tag version and Cargo.toml version are the same
    if: startsWith(github.ref, 'refs/tags/')  # only check on tag pushes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Check tag version and Cargo.toml version are same
        run: |
          TAG_NAME=${GITHUB_REF/refs\/tags\//}
          CARGO_TOML_VERSION=$(grep -E '^version\s*=' Cargo.toml | cut -d '"' -f 2)
          if [ "$TAG_NAME" != "$CARGO_TOML_VERSION" ]; then
            echo "Tag version ($TAG_NAME) and Cargo.toml version ($CARGO_TOML_VERSION) do not match. Please delete the tag, update Cargo.toml, and create a new tag."
            exit 1
          fi

  publish-rust:
    name: >-
      Publish Rust 🦀 crate 📦 to crates.io
    if: startsWith(github.ref, 'refs/tags/')  # only publish to crates.io on tag pushes
    needs:
      - build
      - check-rust-ok
      - check-tagging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Publish crate 📦 to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  upstream-subtree-merge:
    name: >-
      Update google/fonts with a new release of axisregistry
    if: startsWith(github.ref, 'refs/tags/')  # only merge into upstream on tag pushes
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout google/fonts
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3 # zizmor: ignore[artipacked]
        with:
          repository: google/fonts
          token: ${{ secrets.GOOGLE_FONTS_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "axisregistry-bot"
          git config user.email "axisregistry-bot@github.com"

      - name: Create branch
        id: branch
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          BRANCH_NAME="axisregistry-release-${TAG_NAME}"
          git checkout -b "${BRANCH_NAME}"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

      - name: Subtree pull from axisregistry main
        run: |
          git subtree pull \
            --prefix=axisregistry \
            https://github.com/googlefonts/axisregistry.git \
            main

      - name: Push branch to google/fonts
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        run: |
          git push origin "${BRANCH_NAME}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GOOGLE_FONTS_TOKEN }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh pr create \
            --repo google/fonts \
            --base main \
            --head "${BRANCH_NAME}" \
            --title "Update axisregistry to ${TAG_NAME}" \
            --body "This PR updates the \`axisregistry\` subtree with the latest release ($TAG_NAME) from [googlefonts/axisregistry](https://github.com/googlefonts/axisregistry). **Important:** When merging, use the **\"Create a merge commit\"** button, **not** \"Squash and merge\", to preserve subtree history and avoid future merge conflicts."
